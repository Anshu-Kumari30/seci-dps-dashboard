<body class="p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0">Energy Management</h2>
        <a href="/home.html" class="btn btn-secondary">Back to Home</a>

    <ul class="nav nav-tabs" id="dynamicTabs" role="tablist"></ul>
    <div class="tab-content" id="dynamicTabContent"></div>

    <script src="./js/main.js"></script>
    <script>
        // Global selected project (from query param) — used across functions
        window.SELECTED_PROJECT = new URLSearchParams(window.location.search).get('project') || null;
        window.SELECTED_TAB = new URLSearchParams(window.location.search).get('tab') || "developer_payment";

        document.addEventListener("DOMContentLoaded", function () {
            populateTabs();
        });

        function populateTabs() {
            // Use global selected project
            const selectedProject = window.SELECTED_PROJECT;

            const tabList = document.getElementById("dynamicTabs");
            const tabContent = document.getElementById("dynamicTabContent");

            tabList.innerHTML = "";
            tabContent.innerHTML = "";

            // Show selected project title if filtered
            if (selectedProject) {
              const pageTitle = document.querySelector('h2');
              if (pageTitle) {
                pageTitle.textContent = `Energy Management - ${selectedProject}`;
              }
            }

            const types = [
                { id: "developer_payment", label: "Developer Payment" },
                { id: "ps", label: "Power Sale" },
                { id: "dpod", label: "DISCOM payment and Outstanding Dues" },
                { id: "ro", label: "Regulatory Order" },
                { id: "swd", label: "State Wise Details" },
            ];

            const selectedTabId = window.SELECTED_TAB;
            const activeIndex = Math.max(
                0,
                types.findIndex((type) => type.id === selectedTabId)
            );

            types.forEach((type, index) => {

                const tabId = `tab-${type.id}`;
                const isActive = index === activeIndex ? "active" : "";
                const isShow = index === activeIndex ? "show active" : "";

                // Create Tab Button
                const tabButton = document.createElement("li");
                tabButton.className = "nav-item";
                tabButton.innerHTML = `
            <button class="nav-link ${isActive}" 
                data-bs-toggle="tab" 
                data-bs-target="#${tabId}" 
                type="button">
                ${type.label}
            </button>
        `;
                tabList.appendChild(tabButton);

                // Create Tab Content Pane
                const pane = document.createElement("div");
                pane.className = `tab-pane fade ${isShow}`;
                pane.id = tabId;

                // Developer Payment Tab
                if (type.id === "developer_payment") {

                    const addBtn = document.createElement("button");
                    addBtn.className = "btn btn-success mb-3";
                    addBtn.innerText = "+ Add Developer Payment";
                    addBtn.onclick = () => {
                        const q = new URLSearchParams();
                        if (selectedProject) q.set("project", selectedProject);
                        q.set("tab", "developer_payment");
                        window.location.href = "/add_edit_developer_payment.html" + (q.toString() ? `?${q.toString()}` : "");
                    };

                    pane.appendChild(addBtn);

                    const tableContainer = document.createElement("div");
                    tableContainer.id = "developerPaymentTable";
                    pane.appendChild(tableContainer);

                    loadDeveloperPayments(selectedProject);
                }

                // Power Sale Tab
                else if (type.id === "ps") {

                    const addBtn = document.createElement("button");
                    addBtn.className = "btn btn-success mb-3";
                    addBtn.innerText = "+ Add Power Sale";
                    addBtn.onclick = () => {
                        const q = new URLSearchParams();
                        if (selectedProject) q.set("project", selectedProject);
                        q.set("tab", "ps");
                        window.location.href = "/add_edit_power_sale.html" + (q.toString() ? `?${q.toString()}` : "");
                    };

                    pane.appendChild(addBtn);

                    const tableContainer = document.createElement("div");
                    tableContainer.id = "powerSaleTable";
                    pane.appendChild(tableContainer);

                    loadPowerSales(selectedProject);
                }

                // DISCOM Payment Tab
                else if (type.id === "dpod") {

                    const addBtn = document.createElement("button");
                    addBtn.className = "btn btn-success mb-3";
                    addBtn.innerText = "+ Add DISCOM Payment";
                    addBtn.onclick = () => {
                        const q = new URLSearchParams();
                        if (selectedProject) q.set("project", selectedProject);
                        q.set("tab", "dpod");
                        window.location.href = "/add_edit_discom_payment.html" + (q.toString() ? `?${q.toString()}` : "");
                    };

                    pane.appendChild(addBtn);

                    const tableContainer = document.createElement("div");
                    tableContainer.id = "discomPaymentTable";
                    pane.appendChild(tableContainer);

                    loadDiscomPayments(selectedProject);
                }

                // Regulatory Order Tab
                else if (type.id === "ro") {

                    const addBtn = document.createElement("button");
                    addBtn.className = "btn btn-success mb-3";
                    addBtn.innerText = "+ Add Regulatory Order";
                    addBtn.onclick = () => {
                        const q = new URLSearchParams();
                        if (selectedProject) q.set("project", selectedProject);
                        q.set("tab", "ro");
                        window.location.href = "/add_edit_regulatory_order.html" + (q.toString() ? `?${q.toString()}` : "");
                    };

                    pane.appendChild(addBtn);

                    const tableContainer = document.createElement("div");
                    tableContainer.id = "regulatoryOrderTable";
                    pane.appendChild(tableContainer);

                    loadRegulatoryOrders(selectedProject);
                }

                // State Wise Details Tab
                else if (type.id === "swd") {

                    const addBtn = document.createElement("button");
                    addBtn.className = "btn btn-success mb-3";
                    addBtn.innerText = "+ Add State Wise Details";
                    addBtn.onclick = () => {
                        const q = new URLSearchParams();
                        if (selectedProject) q.set("project", selectedProject);
                        q.set("tab", "swd");
                        window.location.href = "/add_edit_state_wise_details.html" + (q.toString() ? `?${q.toString()}` : "");
                    };

                    pane.appendChild(addBtn);

                    const tableContainer = document.createElement("div");
                    tableContainer.id = "stateWiseDetailsTable";
                    pane.appendChild(tableContainer);

                    loadStateWiseDetails(selectedProject);
                }




                tabContent.appendChild(pane);
            });
        }

        function loadDeveloperPayments(selectedProject) {
            if (!selectedProject) {
                buildDeveloperPaymentTable([], selectedProject);
                return;
            }
            let url = `/api/data/developer-payment`;
            if (selectedProject) url += `?project=${encodeURIComponent(selectedProject)}`;
            authFetch(url)
                .then(res => res.json())
                .then(data => buildDeveloperPaymentTable(data, selectedProject))
                .catch(err => console.error(err));
        }

        function loadPowerSales(selectedProject) {

            let url = `/api/data/power-sale`;

            authFetch(url)

        function buildDeveloperPaymentTable(items, selectedProject) {

            const container = document.getElementById("developerPaymentTable");
            items = normalizeItems(items);
            
            // Filter by selected project if provided
            if (selectedProject) {
              items = items.filter(item => {
                                const projectName = item.project_name || item.projectName || "";
                                return isSameProject(projectName, selectedProject);
              });
            }

            let html = `
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>S. No.</th>
                    <th>Document Name</th>
                    <th>Document Date</th>
                    <th>View</th>
                    <th>Uploaded On</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
    `;

            items.forEach((item, index) => {
                html += `
            <tr>
                <td>${index + 1}</td>
                <td>${item.document_name}</td>
                <td>${formatToISTDate(item.document_date)}</td>
                <td>
                    <a href="/${item.document_path}" target="_blank" class="btn btn-sm btn-outline-primary">
                        View
                    </a>
                </td>
                <td>${formatToISTDate(item.createdAt)}</td>
                <td>
                    <button class="btn btn-warning btn-sm me-1" 
                        onclick="editDeveloperPayment('${item.id}')">
                        Edit
                    </button>
                    <button class="btn btn-danger btn-sm"
                        onclick="deleteDeveloperPayment('${item.id}', this)">
                        Delete
                    </button>
                </td>
            </tr>
        `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function deleteDeveloperPayment(id, button) {
            if (!confirm("Are you sure you want to delete this Developer Payment?")) return;

            authFetch(`/api/data/developer-payment/${id}`, {
                method: "DELETE"
            })
                .then(res => {
                    if (!res.ok) throw new Error("Delete failed");
                    button.closest("tr").remove();
                })
                .catch(err => {
                    console.error(err);
                    alert("Error deleting record");
                });
        }

        function normalizeItems(items) {
            return Array.isArray(items) ? items : [];
        }

        function isSameProject(projectName, selectedProject) {
            return String(projectName || "").trim().toLowerCase() === String(selectedProject || "").trim().toLowerCase();
        }

        function authFetch(url, options = {}) {
            const token = localStorage.getItem("token");

            return fetch(url, {
                ...options,
                headers: {
                    Authorization: `Bearer ${token}`
                }
            }).then(res => {
                if (res.status === 401) {
                    alert("Session expired");
                    localStorage.clear();
                    window.location.href = "/";
                    throw new Error("Unauthorized");
                }
                return res;
            });
        }

        function formatToISTDate(dateString) {
            const date = new Date(dateString);
            const istOffset = 5.5 * 60 * 60000;
            const istDate = new Date(date.getTime() + istOffset);

            const day = String(istDate.getUTCDate()).padStart(2, "0");
            const month = String(istDate.getUTCMonth() + 1).padStart(2, "0");
            const year = istDate.getUTCFullYear();

            return `${day}/${month}/${year}`;
        }
