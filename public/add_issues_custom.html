<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script src="./js/auth_guard.js"></script>
<title>Add Issues (Custom)</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
      body { margin:0; background:#eef2f7; font-family: "Segoe UI", Roboto, Arial, sans-serif; color:#1f2937 }
      .page-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px }
      .page-container{ width:100%; max-width:760px }
      .page-title{ text-align:center; font-size:42px; font-weight:700; color:#0b5ed7; margin-bottom:6px }
      .page-subtitle{ text-align:center; color:#6b7280; font-size:21px; margin-bottom:28px }
      .form-card{ background:#fff; border-radius:14px; border:1px solid #e5e7eb; box-shadow:0 8px 22px rgba(15,23,42,0.08); padding:28px }
      .section-title{ color:#0b5ed7; font-size:26px; font-weight:700; margin-bottom:18px; padding-bottom:8px; border-bottom:2px solid #0b5ed7 }
      .form-label{ font-weight:600; color:#1f2937; margin-bottom:8px }
      .form-control{ border-radius:8px; border:1px solid #cfd8e3; min-height:46px }
      .form-control:focus{ border-color:#0b5ed7; box-shadow:0 0 0 0.15rem rgba(11,94,215,0.2) }
      .helper-text{ font-size:13px; color:#6b7280 }
      .form-actions{ display:flex; justify-content:center; gap:12px; margin-top:26px }
      .btn-save{ background:linear-gradient(135deg,#0b5ed7,#1f4e79); border:none; color:#fff; padding:10px 30px; border-radius:8px; font-weight:600 }
      .btn-cancel{ background:#6c757d; border:none; color:#fff; padding:10px 26px; border-radius:8px; font-weight:600 }
    </style>
  </head>
  <body>
  
    <div class="page-wrap">
      <div class="page-container">
        <h1 class="page-title">Add Issue</h1>
        <p class="page-subtitle">Report a key issue for this entity</p>

        <div class="form-card">
          <h2 class="section-title">Issue Details</h2>

          <form id="addIssueForm">
            <div class="row g-3">
              <div class="col-12">
                <label for="issue_description" class="form-label">Issue Description</label>
                <input type="text" class="form-control" id="issue_description" name="issue_description" placeholder="Describe the issue" required />
              </div>
              <div class="col-12">
                <label for="issue_pertaining_to" class="form-label">Issue Status</label>
                <input type="text" class="form-control" id="issue_pertaining_to" name="issue_pertaining_to" placeholder="What is this issue pertaining to?" required />
              </div>
              <div class="col-md-6">
                <label for="issue_date" class="form-label">Issue Date</label>
                <input type="date" class="form-control" id="issue_date" name="issue_date" required />
              </div>
              <div class="col-12">
                <label for="docFile" class="form-label">Upload Issue Document (Optional)</label>
                <div class="helper-text mb-2">Maximum file size allowed: <strong>50 MB</strong>.</div>
                <input type="file" class="form-control" id="docFile" name="doc_file" />
              </div>
            </div>

            <input type="hidden" id="deptId" name="dept_id" />
            <input type="hidden" id="statisticId" name="statistic_id" />
            <input type="hidden" id="entityId" name="entity_id" />

            

            <div class="form-actions">
              <button type="submit" class="btn-save">Save</button>
              <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const urlParams = new URLSearchParams(window.location.search);
      const deptId = urlParams.get("dept_id");
      const statisticId = urlParams.get("statistic_id");
      const entityId = urlParams.get("entity_id");

      const normalizedDept = deptId && deptId !== 'null' ? deptId : '';
      const normalizedStat = statisticId && statisticId !== 'null' ? statisticId : '';
      const normalizedEntity = entityId && entityId !== 'null' ? entityId : '';

      // Resolve dept/stat/entity if missing. Try PMC C&E resolver first, then fallback.
      (async function tryResolveIds(){
        if ((!normalizedDept || !normalizedStat) && normalizedEntity) {
          try {
            let json = null;
            try {
              const res = await authFetch(`/api/data/pmc/ce/context/id/${normalizedEntity}`);
              if (res.ok) json = await res.json();
            } catch (e) {}
            if (!json) {
              try {
                const res2 = await authFetch(`/api/data/entities/context/${normalizedEntity}`);
                if (res2.ok) json = await res2.json();
              } catch (e) {}
            }
            if (json && json.dept_id) {
              normalizedDept = normalizedDept || json.dept_id || '';
              normalizedStat = normalizedStat || json.statistic_id || '';
              const resolvedEntity = json.dept_entity_id || json.entity_id || '';
              normalizedEntity = resolvedEntity || normalizedEntity;
            }
          } catch (err) { console.error('Could not resolve dept/stat from entity_id', err); }
        }
        document.getElementById("deptId").value = normalizedDept;
        document.getElementById("statisticId").value = normalizedStat;
        document.getElementById("entityId").value = normalizedEntity;
      })();

      const submitBtn = document.querySelector('.btn-save');
      if (!normalizedDept || !normalizedStat || !normalizedEntity) {
        submitBtn.disabled = true;
        submitBtn.title = 'Open this form from the PMC C&E page to prefill project identifiers.';
        const warn = document.createElement('div'); warn.className='alert alert-warning'; warn.style.marginBottom='16px';
        warn.innerText = 'Missing project identifiers (dept/statistic/entity). Please open this form from the PMC C&E page for the selected entity.';
        document.querySelector('.form-card').insertBefore(warn, document.getElementById('addIssueForm'));
      }

      function authFetch(url, options = {}) {
        const token = localStorage.getItem('token');
        const defaultHeaders = { Authorization: `Bearer ${token}` };
        return fetch(url, { ...options, headers: { ...defaultHeaders, ...(options.headers||{}) } }).then(res => {
          if (res.status === 401) { localStorage.clear(); window.location.href = '/'; throw new Error('Unauthorized'); }
          return res;
        });
      }

      document.getElementById('addIssueForm').addEventListener('submit', async function(e){
        e.preventDefault();
        if (!normalizedDept || !normalizedStat || !normalizedEntity) { alert('Cannot submit: missing identifiers'); return; }
        const formData = new FormData(this);
        try {
          const res = await authFetch('/api/data/pmc/ce/issues', { method: 'POST', body: formData });
          if(!res.ok) throw new Error('Failed');
          alert('Saved');
          window.location.href = `/pmc_ce_custom.html?dept_id=${normalizedDept}&statistic_id=${normalizedStat}&entity_id=${normalizedEntity}&tab=is&_ts=${Date.now()}`;
        } catch(err){ console.error(err); alert('Save failed'); }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
