<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script src="./js/auth_guard.js"></script>
<title>Add Tariff Petition</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
    <style>
      body { margin: 0; background: #eef2f7; font-family: "Segoe UI", Roboto, Arial, sans-serif; color: #1f2937; }
      .page-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
      .page-container { width: 100%; max-width: 760px; }
      .page-title { text-align: center; font-size: 36px; font-weight: 700; color: #0b5ed7; margin-bottom: 6px; }
      .page-subtitle { text-align: center; color: #6b7280; font-size: 16px; margin-bottom: 18px; }
      .form-card { background: #fff; border-radius: 14px; border: 1px solid #e5e7eb; box-shadow: 0 8px 22px rgba(15,23,42,0.08); padding: 20px; }
      .section-title { color: #0b5ed7; font-size: 20px; font-weight: 700; margin-bottom: 12px; padding-bottom: 6px; border-bottom: 2px solid #0b5ed7; }
      .form-label { font-weight: 600; color: #1f2937; margin-bottom: 8px; }
      .form-control { border-radius: 8px; border: 1px solid #cfd8e3; min-height: 42px; }
      .form-actions { display:flex; justify-content:center; gap:12px; margin-top:18px }
      .btn-save { background: linear-gradient(135deg,#0b5ed7,#1f4e79); border:none; color:#fff; padding:10px 24px; border-radius:8px }
      .btn-cancel { background:#6c757d; border:none; color:#fff; padding:10px 20px; border-radius:8px }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <div class="page-container">
        <h1 class="page-title">Add Tariff Petition</h1>
        <p class="page-subtitle">Upload tariff petition document</p>

        <div class="form-card">
          <h2 class="section-title">Tariff Petition Details</h2>
          <form id="addTariffForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Document Name</label>
                <input type="text" id="docName" name="document_name" class="form-control" placeholder="Enter document name" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Document Date</label>
                <input type="date" id="docDate" name="doc_date" class="form-control" />
              </div>

              <!-- Requested and Approved tariff fields removed -->

              <div class="col-12">
                <label class="form-label">Upload Document</label>
                <div class="helper-text mb-2">Maximum file size allowed: <strong>50 MB</strong>.</div>
                <input type="file" id="docFile" name="doc_file" class="form-control" />
              </div>
            </div>

            <input type="hidden" id="deptId" name="dept_id" />
            <input type="hidden" id="statisticId" name="statistic_id" />
            <input type="hidden" id="entityId" name="entity_id" />

            <div class="form-actions">
              <button type="submit" class="btn-save">Save</button>
              <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      const dept_id = params.get('dept_id') || '';
      const statistic_id = params.get('statistic_id') || '';
      const entity_id = params.get('entity_id') || '';
      if (dept_id) document.getElementById('deptId').value = dept_id;
      if (statistic_id) document.getElementById('statisticId').value = statistic_id;
      if (entity_id) document.getElementById('entityId').value = entity_id;

      function authFetch(url, options = {}) {
        const token = localStorage.getItem('token');
        return fetch(url, { ...options, headers: { Authorization: 'Bearer ' + token, ...(options.headers||{}) } }).then(res => {
          if (res.status === 401) { alert('Session expired.'); localStorage.clear(); window.location.href = '/'; throw new Error('Unauthorized'); }
          return res;
        });
      }

      document.getElementById('addTariffForm').addEventListener('submit', async function (e) {
        e.preventDefault();
        const form = document.getElementById('addTariffForm');
        const formData = new FormData();
        formData.append('dept_id', document.getElementById('deptId').value || '');
        formData.append('statistic_id', document.getElementById('statisticId').value || '');
        formData.append('entity_id', document.getElementById('entityId').value || '');
        formData.append('document_name', document.getElementById('docName').value || '');
        formData.append('doc_date', document.getElementById('docDate').value || '');
        // request/approved tariff params removed
        const fileEl = document.getElementById('docFile');
        if (fileEl && fileEl.files && fileEl.files.length) formData.append('doc_file', fileEl.files[0]);

        try {
          const res = await authFetch('/api/data/documents/tariff/document', { method: 'POST', body: formData });
          const json = await res.json().catch(() => ({}));
          if (!res.ok) { alert(json.error || json.message || 'Failed to add tariff petition'); return; }
          alert('Tariff Petition added successfully');
          // redirect back to external view if context present
          window.location.href = '/external.html?dept_id=' + encodeURIComponent(dept_id) + '&statistic_id=' + encodeURIComponent(statistic_id) + '&entity_id=' + encodeURIComponent(entity_id);
        } catch (err) {
          console.error(err);
          alert('Error adding tariff petition');
        }
      });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
