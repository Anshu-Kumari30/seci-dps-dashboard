<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SECI Project Management Dashboard</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", "Roboto", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 50%, #f8fbff 100%);
        position: relative;
        overflow: hidden;
      }

      /* Decorative background elements */
      body::before {
        content: '';
        position: absolute;
        top: -120px;
        right: -120px;
        width: 500px;
        height: 500px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(13, 110, 253, 0.06) 0%, transparent 70%);
        pointer-events: none;
      }

      body::after {
        content: '';
        position: absolute;
        bottom: -80px;
        left: -80px;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(13, 110, 253, 0.05) 0%, transparent 70%);
        pointer-events: none;
      }

      .login-container {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 60px;
        width: 100%;
        max-width: 1100px;
        padding: 40px 20px;
        position: relative;
        z-index: 1;
      }

      /* Left side - Branding */
      .brand-section {
        flex: 1;
        max-width: 480px;
        text-align: center;
      }

      .brand-title {
        font-size: 1.6rem;
        font-weight: 700;
        color: #1a2634;
        letter-spacing: 0.3px;
        line-height: 1.3;
      }

      .brand-subtitle {
        font-size: 0.95rem;
        font-weight: 500;
        color: #5a6a7a;
        letter-spacing: 0.5px;
        margin-top: 6px;
        /*text-transform: uppercase;*/
      }

      .brand-logo-wrapper {
        margin: 28px auto;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .brand-logo-wrapper img {
        height: 110px;
        width: auto;
        object-fit: contain;
      }

      .brand-dashboard-title {
        font-size: 1.5rem;
        font-weight: 600;
        color: #0d6efd;
        letter-spacing: 0.3px;
        position: relative;
        display: inline-block;
      }

      .brand-dashboard-title::after {
        content: '';
        display: block;
        width: 60%;
        height: 3px;
        background: linear-gradient(90deg, #0d6efd, transparent);
        border-radius: 2px;
        margin: 8px auto 0;
      }

      /* Right side - Login Card */
      .login-card {
        background: #ffffff;
        border: 1px solid rgba(13, 110, 253, 0.12);
        border-radius: 1rem;
        box-shadow: 0 10px 40px rgba(13, 110, 253, 0.08);
        padding: 40px 36px;
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      .login-card-header {
        margin-bottom: 28px;
      }

      .login-card-header h2 {
        font-size: 1.5rem;
        font-weight: 600;
        color: #1a2634;
      }

      .login-card-header p {
        font-size: 0.85rem;
        color: #888;
        margin-top: 6px;
      }

      .login-card form {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .input-group-custom {
        text-align: left;
      }

      .input-group-custom label {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        color: #4a5568;
        margin-bottom: 5px;
        letter-spacing: 0.3px;
      }

      .login-card input[type="email"],
      .login-card input[type="password"] {
        width: 100%;
        padding: 12px 14px;
        font-size: 0.95rem;
        font-family: "Poppins", sans-serif;
        line-height: 20px;
        height: 46px;
        box-sizing: border-box;
        border-radius: 8px;
        border: 1.5px solid #e2e8f0;
        background: #f8fafc;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      .login-card input[type="email"]:focus,
      .login-card input[type="password"]:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.12);
        background: #fff;
      }

      .login-card input::placeholder {
        font-size: 0.9rem;
        color: #a0aec0;
      }

      .password-field {
        position: relative;
        display: flex;
        align-items: center;
      }

      .password-field input {
        padding-right: 44px;
      }

      .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent !important;
        border: none;
        padding: 4px;
        cursor: pointer;
        color: #6b7280;
        line-height: 1;
        box-shadow: none;
        -webkit-tap-highlight-color: transparent;
      }

      .toggle-password svg {
        display: block;
      }

      .toggle-password:hover {
        color: #0d6efd;
      }

      .toggle-password:focus,
      .toggle-password:focus-visible,
      .toggle-password:active {
        outline: none;
        box-shadow: none;
        background: transparent !important;
      }

      .login-card .btn-login {
        width: 100%;
        padding: 13px;
        font-size: 1rem;
        font-weight: 600;
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.2s;
        box-shadow: 0 4px 14px rgba(13, 110, 253, 0.25);
        letter-spacing: 0.3px;
      }

      .login-card .btn-login:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px rgba(13, 110, 253, 0.35);
      }

      .login-card .btn-login:active {
        transform: scale(0.98);
      }

      .form-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.85rem;
        margin-top: 4px;
      }

      .forgot-link {
        color: #0b5ed7;
        text-decoration: none;
        font-weight: 500;
        transition: color 0.2s;
      }

      .forgot-link:hover {
        color: #0d6efd;
        text-decoration: underline;
      }

      .error-msg {
        color: #dc3545;
        font-size: 0.82rem;
        min-height: 18px;
        font-weight: 500;
      }

      /* Separator line */
      .divider {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 6px 0 2px;
      }

      .divider-line {
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(13, 110, 253, 0.15), transparent);
      }

      /* Responsive */
      @media (max-width: 768px) {
        .login-container {
          flex-direction: column;
          gap: 30px;
          padding: 30px 16px;
        }

        .brand-section {
          max-width: 100%;
        }

        .brand-title {
          font-size: 1.3rem;
        }

        .brand-logo-wrapper img {
          height: 80px;
        }

        .brand-dashboard-title {
          font-size: 1.2rem;
        }

        .login-card {
          padding: 30px 24px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <!-- Left side - Branding Section -->
      <div class="brand-section">
        <div class="brand-title">Solar Energy Corporation of India</div>
        <div class="brand-subtitle">A Government Enterprise of India</div>

        <div class="brand-logo-wrapper">
          <img
            src="https://www.seci.co.in/frontend/assets/images/seci-logo.png"
            alt="SECI Logo"
          />
        </div>

        <div class="brand-dashboard-title">Project Management Dashboard</div>
      </div>

      <!-- Right side - Login Card -->
      <div class="login-card">
        <div class="login-card-header">
          <h2>Login Portal</h2>
          <p>Sign in to access the dashboard</p>
        </div>

        <form id="loginForm" autocomplete="off">
          <div class="input-group-custom">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </div>

          <div class="input-group-custom">
            <label for="password">Password</label>
            <div class="password-field">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="new-password"
                required
              />
              <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
                <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                  <path fill="currentColor" d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
                </svg>
              </button>
            </div>
          </div>

          <button type="submit" class="btn-login">Sign In</button>

          <div class="divider">
            <span class="divider-line"></span>
          </div>

          <div class="form-footer">
            <span class="error-msg" id="loginError"></span>
            <a class="forgot-link" href="/forgot_password.html">Forgot your password?</a>
          </div>
        </form>
      </div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const emailInput = loginForm.querySelector('input[name="email"]');
      const passwordInput = loginForm.querySelector('input[name="password"]');
      const togglePassword = loginForm.querySelector('.toggle-password');
      const loginError = document.getElementById("loginError");

      // Force empty credentials on each page load.
      emailInput.value = "";
      passwordInput.value = "";

      togglePassword.addEventListener("mousedown", (e) => {
        e.preventDefault();
      });

      togglePassword.addEventListener("click", () => {
        const isHidden = passwordInput.type === "password";
        passwordInput.type = isHidden ? "text" : "password";
        togglePassword.setAttribute("aria-pressed", String(isHidden));
        togglePassword.setAttribute(
          "aria-label",
          isHidden ? "Hide password" : "Show password"
        );
      });

      function showLoginError(message) {
        loginError.textContent = message || "";
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        showLoginError("");

        const form = e.target;
        const formData = new FormData(form);
        const email = formData.get("email");
        const password = formData.get("password");

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        try {
          const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({ email, password }),
            signal: controller.signal,
          });

          clearTimeout(timeoutId);

          const responseBody = await response.json().catch(() => null);

          if (response.ok) {
            jwt_token = responseBody?.login_token;
            app_environment = responseBody?.app_environment;
            localStorage.setItem("token", jwt_token);
            localStorage.setItem("app_environment", app_environment);

            window.location.href = "/home.html";
            return;
          }

          const errorText = responseBody?.error || "Invalid email or password.";
          showLoginError(errorText);
        } catch (err) {
          console.error("Login error:", err);
          if (err.name === "AbortError") {
            showLoginError("Login timed out. Please try again.");
          } else {
            showLoginError("Unable to sign in. Please try again.");
          }
        }
      });
    </script>
  </body>
</html>
