<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        font-size: 22px;
        margin: 0;
        background-color: #f4f6f9;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .login-card {
        background-color: #fff;
        padding: 40px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 400px;
        text-align: center;
      }

      /* Added some spacing for the logo */
      .login-logo {
        height: 80px;
        width: auto;
        margin-bottom: 20px;
      }

      .login-card h2 {
        margin-bottom: 25px;
        font-size: 1.8rem;
        font-weight: bold;
        color: #333;
      }

      .login-card form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .login-card input[type="email"],
      .login-card input[type="password"] {
        padding: 12px;
        font-size: 1rem;
        line-height: 20px;
        height: 44px;
        box-sizing: border-box;
        border-radius: 6px;
        border: 1px solid #ccc;
        outline: none;
      }

      .login-card input::placeholder {
        font-size: 1rem;
        line-height: 20px;
      }

      .password-field {
        position: relative;
        display: flex;
        align-items: center;
      }

      .password-field input {
        width: 100%;
        padding-right: 44px;
      }

      .toggle-password {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: transparent !important;
        border: none;
        padding: 4px;
        cursor: pointer;
        color: #6b7280;
        line-height: 1;
        box-shadow: none;
        -webkit-tap-highlight-color: transparent;
      }

      .toggle-password svg {
        display: block;
      }

      .toggle-password:hover {
        color: #0b5ed7;
      }

      .toggle-password:focus,
      .toggle-password:focus-visible,
      .toggle-password:active {
        outline: none;
        box-shadow: none;
        background: transparent !important;
      }

      .login-card button {
        padding: 12px;
        font-size: 1rem;
        background-color: #0d6efd;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .login-card button:hover {
        background-color: #0b5ed7;
      }

      .form-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.95rem;
      }

      .forgot-link {
        color: #0b5ed7;
        text-decoration: none;
      }

      .forgot-link:hover {
        text-decoration: underline;
      }

      /* Warning box style */
      .warning-box {
        background-color: #fff3cd;
        color: #856404;
        border: 1px solid #ffeeba;
        padding: 15px;
        margin-top: 20px;
        font-size: 0.9rem;
        border-radius: 6px;
        text-align: left;
      }

      .error-msg {
        color: red;
        font-size: 0.9rem;
        min-height: 18px;
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <!-- SECI Logo added here -->
      <img
        src="https://www.seci.co.in/frontend/assets/images/seci-logo.png"
        alt="SECI Logo"
        class="login-logo"
      />

      <h2>Project Management Dashboard</h2>
      <form id="loginForm" autocomplete="off">
        <input type="email" name="email" placeholder="Email address" autocomplete="off" autocapitalize="off" spellcheck="false" required />
        <div class="password-field">
          <input
            type="password"
            name="password"
            placeholder="Password"
            autocomplete="new-password"
            required
          />
          <button type="button" class="toggle-password" aria-label="Show password" aria-pressed="false">
            <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path fill="currentColor" d="M12 5c-5 0-9.27 3.11-11 7 1.73 3.89 6 7 11 7s9.27-3.11 11-7c-1.73-3.89-6-7-11-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10zm0-2.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>
            </svg>
          </button>
        </div>
        <button type="submit">Login</button>
        <div class="form-footer">
          <span class="error-msg" id="loginError"></span>
          <a class="forgot-link" href="/forgot_password.html">Forgot your password?</a>
        </div>

        <!-- Warning box added below the form fields -->
        <!-- <div class="warning-box">
          <strong>Warning:</strong> If after login you see that the portal is in
          "TESTING" mode, kindly do not make changes as they will not be saved.
          Data shown may also be different from the actual data.
        </div> -->
      </form>

      <script>
        const loginForm = document.getElementById("loginForm");
        const emailInput = loginForm.querySelector('input[name="email"]');
        const passwordInput = loginForm.querySelector('input[name="password"]');
        const togglePassword = loginForm.querySelector('.toggle-password');
        const loginError = document.getElementById("loginError");

        // Force empty credentials on each page load.
        emailInput.value = "";
        passwordInput.value = "";

        togglePassword.addEventListener("mousedown", (e) => {
          // Keep focus on the password input to avoid UI jitter.
          e.preventDefault();
        });

        togglePassword.addEventListener("click", () => {
          const isHidden = passwordInput.type === "password";
          passwordInput.type = isHidden ? "text" : "password";
          togglePassword.setAttribute("aria-pressed", String(isHidden));
          togglePassword.setAttribute(
            "aria-label",
            isHidden ? "Hide password" : "Show password"
          );
        });

        function showLoginError(message) {
          loginError.textContent = message || "";
        }

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            showLoginError("");

            const form = e.target;
            const formData = new FormData(form);
            const email = formData.get("email");
            const password = formData.get("password");

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 8000);

            try {
              const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({ email, password }),
                signal: controller.signal,
              });

              clearTimeout(timeoutId);

              if (response.ok) {
                const response_json = await response.json();

                // ✅ Store token in localStorage
                jwt_token = response_json.login_token;
                app_environment = response_json.app_environment;
                localStorage.setItem("token", jwt_token);
                localStorage.setItem("app_environment", app_environment);

                // ✅ Redirect to home page
                window.location.href = "/home.html";
              }

              const errorBody = await response.json().catch(() => null);
              const errorText = errorBody?.error || "Invalid email or password.";
              showLoginError(errorText);
            } catch (err) {
              console.error("Login error:", err);
              if (err.name === "AbortError") {
                showLoginError("Login timed out. Please try again.");
              } else {
                showLoginError("Unable to sign in. Please try again.");
              }
            }
          });
      </script>
    </div>
  </body>
</html>
