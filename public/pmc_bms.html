<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PMC - BMS Projects</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>body{font-family:Arial, Helvetica, sans-serif; padding:18px;} .table-wrap{max-width:1200px;margin:auto;} .btn-space{margin-right:6px;}</style>
</head>
<body>
  <h3>PMC - BMS Projects</h3>
  <p class="text-muted">This page shows only PMC entries with Service Type = BMS.</p>

  <div style="text-align:right; margin-bottom:10px;">
    <a class="btn btn-success" id="addBms" href="/add_pmc_entry.html?serviceType=BMS&bmsOnly=1">Add / Edit BMS Entry</a>
  </div>

  <div class="table-wrap">
    <table class="table table-bordered table-striped">
      <thead class="table-primary">
        <tr><th>S.no</th><th>Client</th><th>Project Details</th><th>Start Date</th><th>End Date</th><th>Total</th><th>Received</th><th>Status</th><th>Actions</th></tr>
      </thead>
      <tbody id="pmcBmsTbody"></tbody>
    </table>
  </div>

  <script>
    function authFetch(url, options = {}) {
      const token = localStorage.getItem('token');
      const defaultHeaders = { 'Content-Type': 'application/json' };
      if (token) defaultHeaders['Authorization'] = 'Bearer ' + token;
      return fetch(url, { ...options, headers: { ...defaultHeaders, ...(options.headers||{}) } }).then(res => {
        if (res.status === 401) { alert('Session expired. Please login.'); localStorage.clear(); window.location.href = '/'; throw new Error('Unauthorized'); }
        return res;
      });
    }

    async function loadBms() {
      const tbody = document.getElementById('pmcBmsTbody');
      tbody.innerHTML = '<tr><td colspan="9">Loading...</td></tr>';
      try {
        const res = await authFetch('/api/data/pmc/entry/all');
        if (!res.ok) throw new Error('Failed to load entries');
        const json = await res.json();
        const projects = Array.isArray(json.data) ? json.data : json;
        const bms = projects.filter(p => String((p.service_type||p.serviceType||'')).trim().toUpperCase() === 'BMS');
        if (!bms.length) { tbody.innerHTML = '<tr><td colspan="9">No BMS entries found.</td></tr>'; return; }

        tbody.innerHTML = '';
        bms.forEach((p, i) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${i+1}</td>
            <td>${escapeHtml(p.client || '')}</td>
            <td>${escapeHtml(p.project_details || p.projectDetails || '')}</td>
            <td>${formatDate(p.start_date || p.startDate || p.loa_date || '')}</td>
            <td>${formatDate(p.end_date || p.endDate || '')}</td>
            <td>${Number(p.total_amount||p.totalAmount||0).toFixed(2)}</td>
            <td>${Number(p.amount_received||p.amountReceived||0).toFixed(2)}</td>
            <td>${escapeHtml(p.status || '')}</td>
            <td>
              <a class="btn btn-sm btn-primary btn-space" href="/pmc_performance.html?segment=BMS&client=${encodeURIComponent(p.client||'')}">View</a>
              <a class="btn btn-sm btn-secondary" href="/add_pmc_entry.html?edit=${encodeURIComponent(p.pmc_entry_id)}">Edit</a>
            </td>`;
          tbody.appendChild(tr);
        });
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="9">Error: ${escapeHtml(String(err.message||err))}</td></tr>`;
        console.error(err);
      }
    }

    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function formatDate(d){ if(!d) return ''; try{ const dt=new Date(d); return dt.toISOString().slice(0,10); }catch(e){ return String(d); } }

    loadBms();
  </script>
</body>
</html>
