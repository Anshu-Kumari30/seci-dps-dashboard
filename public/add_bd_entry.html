<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add Business Development Entry</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script src="./js/auth_guard.js"></script>
    <link rel="stylesheet" href="css/style.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #f4f6f9 0%, #e8ecf1 100%);
        padding: 20px;
        min-height: 100vh;
        color: #333;
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #0b5ed7;
        font-weight: 700;
        font-size: 28px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 16px;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .form-container {
        max-width: 1000px;
        margin: auto;
        background: #ffffff;
        padding: 35px 40px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      }

      form {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px 30px;
      }

      .form-section {
        grid-column: span 2;
        margin-top: 10px;
        margin-bottom: 5px;
        padding-bottom: 8px;
        border-bottom: 2px solid #0b5ed7;
        color: #0b5ed7;
        font-weight: 600;
        font-size: 18px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        font-size: 14px;
        color: #333;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
      }

      .required::after {
        content: " *";
        color: #dc3545;
      }

      .input-with-unit {
        position: relative;
      }

      .unit {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
        font-size: 13px;
        background: #f8f9fa;
        padding: 2px 8px;
        border-radius: 3px;
        pointer-events: none;
      }

      input, textarea {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        border: 1px solid #cfd4da;
        border-radius: 6px;
        transition: all 0.3s;
        font-family: inherit;
      }

      input:focus, textarea:focus {
        outline: none;
        border-color: #0b5ed7;
        box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
      }

      textarea {
        resize: vertical;
        min-height: 80px;
      }

      .full-width {
        grid-column: span 2;
      }

      .btn-group {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      button, .btn-back {
        padding: 12px 32px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        min-width: 140px;
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }

      .btn-submit {
        background: linear-gradient(to right, #0b5ed7, #0a58ca);
        color: #fff;
        box-shadow: 0 4px 6px rgba(11, 94, 215, 0.2);
      }

      .btn-submit:hover {
        background: linear-gradient(to right, #0a58ca, #0950b8);
        box-shadow: 0 6px 12px rgba(11, 94, 215, 0.3);
        transform: translateY(-2px);
      }

      .btn-back {
        background: linear-gradient(to right, #6c757d, #5c636a);
        color: #fff;
        box-shadow: 0 4px 6px rgba(108, 117, 125, 0.2);
      }

      .btn-back:hover {
        background: linear-gradient(to right, #5c636a, #495057);
        box-shadow: 0 6px 12px rgba(108, 117, 125, 0.3);
        transform: translateY(-2px);
        color: #fff;
      }

      button:active, .btn-back:active {
        transform: translateY(0);
      }

      .validation-summary {
        background-color: #f8d7da;
        color: #721c24;
        padding: 12px 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        border: 1px solid #f5c6cb;
        display: none;
      }

      .validation-summary ul {
        margin-left: 20px;
      }

      @media (max-width: 768px) {
        body {
          padding: 15px;
        }

        .form-container {
          padding: 25px 20px;
        }

        form {
          grid-template-columns: 1fr;
          gap: 15px;
        }

        .form-section,
        .full-width {
          grid-column: span 1;
        }

        .btn-group {
          flex-direction: column;
          align-items: center;
        }

        button, .btn-back {
          width: 100%;
          max-width: 300px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Add Business Development Entry</h1>
    <p class="subtitle">
      Fill in the details below to add a new Business Development entry
    </p>

    <div class="form-container">
      <div id="validation-summary" class="validation-summary">
        <strong>Please correct the following errors:</strong>
        <ul id="validation-errors"></ul>
      </div>

      <form id="bdForm">
        <div class="form-section">Business Details</div>

        <div class="form-group">
          <label for="business_partner" class="required">Business Partner</label>
          <input type="text" id="business_partner" name="business_partner" required />
        </div>

        <div class="form-group">
          <label for="location" class="required">Location</label>
          <input type="text" id="location" name="location" required />
        </div>

        <div class="form-section">Action Details</div>

        <div class="form-group full-width">
          <label for="action_plan" class="required">Action Plan</label>
          <textarea id="action_plan" name="action_plan" rows="4" required></textarea>
        </div>

        <div class="form-group">
          <label for="action_pending_with" class="required">Action Pending With</label>
          <input type="text" id="action_pending_with" name="action_pending_with" required />
        </div>

        <div class="form-section">Capacity &amp; Targets</div>

        <div class="form-group">
          <label for="anticipated_capacity" class="required">Anticipated Capacity</label>
          <div class="input-with-unit">
            <input type="text" id="anticipated_capacity" name="anticipated_capacity" required />
            <span class="unit">MW</span>
          </div>
        </div>

        <div class="form-group">
          <label for="target" class="required">Target</label>
          <input type="text" id="target" name="target" required />
        </div>

        <div class="form-section">Additional Information</div>

        <div class="form-group">
          <label for="connectivity">Connectivity</label>
          <input type="text" id="connectivity" name="connectivity" placeholder="Enter connectivity details" />
        </div>

        <div class="form-group">
          <label for="technology">Technology</label>
          <input type="text" id="technology" name="technology" placeholder="Enter technology details" />
        </div>

        <div class="form-group full-width">
          <label for="buyer">Buyer</label>
          <input type="text" id="buyer" name="buyer" placeholder="Enter buyer name" />
        </div>

        <div class="btn-group full-width">
          <button type="submit" class="btn-submit">Submit</button>
          <a href="/business_development_external.html" class="btn-back">Back</a>
        </div>
      </form>
    </div>

    <script>
      document
        .getElementById("bdForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const validationErrors = [];
          const errorList = document.getElementById("validation-errors");
          const summary = document.getElementById("validation-summary");
          errorList.innerHTML = "";
          summary.style.display = "none";

          const business_partner = document.getElementById("business_partner").value.trim();
          const location = document.getElementById("location").value.trim();
          const action_plan = document.getElementById("action_plan").value.trim();
          const action_pending_with = document.getElementById("action_pending_with").value.trim();
          const anticipatedCapacityInput = document.getElementById("anticipated_capacity").value.trim();
          const target = document.getElementById("target").value.trim();

          if (!business_partner) validationErrors.push("Business Partner is required");
          if (!location) validationErrors.push("Location is required");
          if (!action_plan) validationErrors.push("Action Plan is required");
          if (!action_pending_with) validationErrors.push("Action Pending With is required");

          const anticipatedCapacityValue = parseFloat(anticipatedCapacityInput);
          if (!anticipatedCapacityInput || isNaN(anticipatedCapacityValue)) {
            validationErrors.push("Anticipated Capacity must be a valid number");
          }

          if (!target) validationErrors.push("Target is required");

          if (validationErrors.length > 0) {
            validationErrors.forEach(function(err) {
              const li = document.createElement("li");
              li.textContent = err;
              errorList.appendChild(li);
            });
            summary.style.display = "block";
            summary.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
          }

          const data = {
            business_partner: business_partner,
            location: location,
            action_plan: action_plan,
            action_pending_with: action_pending_with,
            anticipated_capacity: anticipatedCapacityValue,
            target: target,
            connectivity: document.getElementById("connectivity").value.trim(),
            technology: document.getElementById("technology").value.trim(),
            buyer: document.getElementById("buyer").value.trim(),
          };

          authFetch("/api/data/bd/entry/add", {
            method: "POST",
            body: JSON.stringify(data),
          })
            .then((res) => {
              if (!res.ok) throw new Error("Failed to add BD entry.");
              alert("Business Development entry added successfully.");
              window.location.href = "/business_development_external.html";
            })
            .catch((err) => {
              console.error(err);
              alert("Error adding Business Development entry.");
            });
        });

      function authFetch(url, options = {}) {
        const token = localStorage.getItem("token");
        const defaultHeaders = {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        };

        return fetch(url, {
          ...options,
          headers: {
            ...defaultHeaders,
            ...(options.headers || {}),
          },
        }).then((res) => {
          if (res.status === 401) {
            alert("Session expired. Redirecting to login...");
            localStorage.clear();
            window.location.href = "/";
            throw new Error("Unauthorized");
          }
          return res;
        });
      }
    </script>
  </body>
</html>
