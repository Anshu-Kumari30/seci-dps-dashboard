<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Forgot Password</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Poppins", sans-serif;
        font-size: 22px;
        margin: 0;
        background-color: #f4f6f9;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      .reset-card {
        background-color: #fff;
        padding: 40px;
        border: 1px solid #ddd;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.08);
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .reset-card h2 {
        margin-bottom: 18px;
        font-size: 1.6rem;
        font-weight: bold;
        color: #333;
      }

      .reset-card p {
        font-size: 0.95rem;
        color: #555;
        margin: 0 0 18px 0;
      }

      .reset-card form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-align: left;
      }

      .reset-card label {
        font-size: 0.95rem;
        color: #333;
      }

      .reset-card input {
        padding: 12px;
        font-size: 1rem;
        line-height: 20px;
        height: 44px;
        box-sizing: border-box;
        border-radius: 6px;
        border: 1px solid #ccc;
        outline: none;
      }

      .reset-card button {
        padding: 12px;
        font-size: 1rem;
        background-color: #0d6efd;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      .reset-card button:hover {
        background-color: #0b5ed7;
      }

      .helper {
        font-size: 0.9rem;
        color: #6b7280;
      }

      .error-msg {
        color: #b91c1c;
        font-size: 0.9rem;
        min-height: 18px;
      }

      .success-msg {
        color: #15803d;
        font-size: 0.9rem;
        min-height: 18px;
      }

      .back-link {
        display: inline-block;
        margin-top: 14px;
        font-size: 0.95rem;
        color: #0b5ed7;
        text-decoration: none;
      }

      .back-link:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="reset-card">
      <h2>Reset your password</h2>
      <p>Enter your email address and we will send reset instructions.</p>
      <form id="forgotForm" autocomplete="off">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" required />
        <span class="error-msg" id="forgotError"></span>
        <span class="success-msg" id="forgotSuccess"></span>
        <button type="submit">Send reset email</button>
      </form>
      <a class="back-link" href="/login.html">Back to login</a>
    </div>

    <script>
      const forgotForm = document.getElementById("forgotForm");
      const errorMsg = document.getElementById("forgotError");
      const successMsg = document.getElementById("forgotSuccess");

      function setError(message) {
        errorMsg.textContent = message || "";
      }

      function setSuccess(message) {
        successMsg.textContent = message || "";
      }

      forgotForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        setError("");
        setSuccess("");

        const email = new FormData(forgotForm).get("email");

        // Placeholder: backend endpoint not wired yet.
        setSuccess("If an account exists, a reset email will be sent.");

        // TODO: Replace with actual endpoint once available.
        // await fetch("/api/auth/password/forgot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email }) });
      });
    </script>
  </body>
</html>
