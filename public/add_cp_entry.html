<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Add C&P Own Project</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script src="./js/auth_guard.js"></script>
    <link rel="stylesheet" href="css/style.css" />

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        background: linear-gradient(135deg, #f4f6f9 0%, #e8ecf1 100%);
        padding: 20px;
        min-height: 100vh;
        color: #333;
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #0b5ed7;
        font-weight: 700;
        font-size: 28px;
      }

      .subtitle {
        text-align: center;
        color: #666;
        margin-bottom: 30px;
        font-size: 16px;
        max-width: 600px;
        margin-left: auto;
        margin-right: auto;
      }

      .form-container {
        max-width: 1000px;
        margin: auto;
        background: #ffffff;
        padding: 35px 40px;
        border-radius: 12px;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      }

      form {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px 30px;
      }

      .form-section {
        grid-column: span 2;
        margin-top: 10px;
        margin-bottom: 5px;
        padding-bottom: 8px;
        border-bottom: 2px solid #0b5ed7;
        color: #0b5ed7;
        font-weight: 600;
        font-size: 18px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      label {
        font-weight: 600;
        font-size: 14px;
        color: #333;
        margin-bottom: 8px;
        display: flex;
        align-items: center;
      }

      .required::after {
        content: " *";
        color: #dc3545;
      }

      .input-with-unit {
        position: relative;
      }

      .unit {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: #666;
        font-size: 13px;
        background: #f8f9fa;
        padding: 2px 8px;
        border-radius: 3px;
        pointer-events: none;
      }

      input, textarea {
        width: 100%;
        padding: 12px;
        font-size: 15px;
        border: 1px solid #cfd4da;
        border-radius: 6px;
        transition: all 0.3s;
        font-family: inherit;
      }

      input:focus, textarea:focus {
        outline: none;
        border-color: #0b5ed7;
        box-shadow: 0 0 0 3px rgba(11, 94, 215, 0.15);
      }

      textarea {
        resize: vertical;
        min-height: 80px;
      }

      .full-width {
        grid-column: span 2;
      }

      .btn-group {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      button, .btn-back {
        padding: 12px 32px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: all 0.3s;
        min-width: 140px;
        text-decoration: none;
        display: inline-block;
        text-align: center;
      }

      .btn-submit {
        background: linear-gradient(to right, #0b5ed7, #0a58ca);
        color: #fff;
        box-shadow: 0 4px 6px rgba(11, 94, 215, 0.2);
      }

      .btn-submit:hover {
        background: linear-gradient(to right, #0a58ca, #0950b8);
        box-shadow: 0 6px 12px rgba(11, 94, 215, 0.3);
        transform: translateY(-2px);
      }

      .btn-back {
        background: linear-gradient(to right, #6c757d, #5c636a);
        color: #fff;
        box-shadow: 0 4px 6px rgba(108, 117, 125, 0.2);
      }

      .btn-back:hover {
        background: linear-gradient(to right, #5c636a, #495057);
        transform: translateY(-2px);
        color: #fff;
      }

      button:active, .btn-back:active {
        transform: translateY(0);
      }

      .validation-summary {
        background-color: #f8d7da;
        color: #721c24;
        padding: 12px 15px;
        border-radius: 6px;
        margin-bottom: 20px;
        border: 1px solid #f5c6cb;
        display: none;
      }

      .validation-summary ul {
        margin-left: 20px;
      }

      @media (max-width: 768px) {
        body {
          padding: 15px;
        }

        .form-container {
          padding: 25px 20px;
        }

        form {
          grid-template-columns: 1fr;
          gap: 15px;
        }

        .form-section,
        .full-width {
          grid-column: span 1;
        }

        .btn-group {
          flex-direction: column;
          align-items: center;
        }

        button, .btn-back {
          width: 100%;
          max-width: 300px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Add C&P Own Project</h1>
    <p class="subtitle">
      Fill in the details below to add a new C&P Own Project entry
    </p>

    <div class="form-container">
      <div id="validation-summary" class="validation-summary">
        <strong>Please correct the following errors:</strong>
        <ul id="validation-errors"></ul>
      </div>

      <form id="cpForm">
        <div class="form-section">Project Details</div>

        <div class="form-group full-width">
          <label for="project_name" class="required">Name of Work &amp; Location</label>
          <textarea id="project_name" name="project_name" rows="3" required></textarea>
        </div>

        <div class="form-group">
          <label for="capacity_mw" class="required">Capacity</label>
          <div class="input-with-unit">
            <input type="number" id="capacity_mw" name="capacity_mw" step="0.01" required />
            <span class="unit">MW</span>
          </div>
        </div>

        <div class="form-group">
          <label for="agency">Agency</label>
          <input type="text" id="agency" name="agency" placeholder="Enter agency name" />
        </div>

        <div class="form-section">Cost &amp; Agreement</div>

        <div class="form-group">
          <label for="estimated_cost">Estimated Cost (in Cr)</label>
          <input type="text" id="estimated_cost" name="estimated_cost" placeholder="e.g. 558" />
        </div>

        <div class="form-group">
          <label for="awarded_cost">Awarded Cost (in Cr)</label>
          <input type="text" id="awarded_cost" name="awarded_cost" placeholder="e.g. 510" />
        </div>

        <div class="form-group full-width">
          <label for="agreement_no">Agreement No.</label>
          <input type="text" id="agreement_no" name="agreement_no" placeholder="Enter agreement number" />
        </div>

        <div class="form-section">Schedule</div>

        <div class="form-group">
          <label for="date_of_start">Date of Start</label>
          <input type="date" id="date_of_start" name="date_of_start" />
        </div>

        <div class="form-group">
          <label for="completion_time">Time of Completion</label>
          <input type="text" id="completion_time" name="completion_time" placeholder="e.g. 18 months from CA" />
        </div>

        <div class="form-group full-width">
          <label for="remarks">Remarks</label>
          <textarea id="remarks" name="remarks" rows="3" placeholder="Enter any remarks"></textarea>
        </div>

        <div class="btn-group full-width">
          <button type="submit" class="btn-submit">Submit</button>
          <a href="/cp_own_projects.html" class="btn-back">Back</a>
        </div>
      </form>
    </div>

    <script>
      document
        .getElementById("cpForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          const validationErrors = [];
          const errorList = document.getElementById("validation-errors");
          const summary = document.getElementById("validation-summary");
          errorList.innerHTML = "";
          summary.style.display = "none";

          const project_name = document.getElementById("project_name").value.trim();
          const capacityInput = document.getElementById("capacity_mw").value.trim();

          if (!project_name) validationErrors.push("Project Name / Location is required");

          const capacityValue = parseFloat(capacityInput);
          if (!capacityInput || isNaN(capacityValue)) {
            validationErrors.push("Capacity must be a valid number");
          }

          if (validationErrors.length > 0) {
            validationErrors.forEach(function(err) {
              const li = document.createElement("li");
              li.textContent = err;
              errorList.appendChild(li);
            });
            summary.style.display = "block";
            summary.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
          }

          const data = {
            project_name: project_name,
            capacity_mw: capacityValue,
            estimated_cost: document.getElementById("estimated_cost").value.trim(),
            awarded_cost: document.getElementById("awarded_cost").value.trim(),
            agreement_no: document.getElementById("agreement_no").value.trim(),
            agency: document.getElementById("agency").value.trim(),
            date_of_start: document.getElementById("date_of_start").value,
            completion_time: document.getElementById("completion_time").value.trim(),
            remarks: document.getElementById("remarks").value.trim(),
          };

          authFetch("/api/data/cp/entry/add", {
            method: "POST",
            body: JSON.stringify(data),
          })
            .then((res) => {
              if (!res.ok) throw new Error("Failed to add C&P own project.");
              alert("C&P own project added successfully.");
              window.location.href = "/cp_own_projects.html";
            })
            .catch((err) => {
              console.error(err);
              alert("Error adding C&P own project.");
            });
        });

      function authFetch(url, options = {}) {
        const token = localStorage.getItem("token");
        const defaultHeaders = {
          "Content-Type": "application/json",
          Authorization: `Bearer ${token}`,
        };

        return fetch(url, {
          ...options,
          headers: {
            ...defaultHeaders,
            ...(options.headers || {}),
          },
        }).then((res) => {
          if (res.status === 401) {
            alert("Session expired. Redirecting to login...");
            localStorage.clear();
            window.location.href = "/";
            throw new Error("Unauthorized");
          }
          return res;
        });
      }
    </script>
  </body>
</html>
