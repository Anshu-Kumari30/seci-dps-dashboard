<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script src="./js/auth_guard.js"></script>
<title>Add Contract Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    />
    <style>
      body {
        margin: 0;
        background: #eef2f7;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        color: #1f2937;
      }

      .page-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }

      .page-container {
        width: 100%;
        max-width: 760px;
      }

      .page-title {
        text-align: center;
        font-size: 42px;
        font-weight: 700;
        color: #0b5ed7;
        margin-bottom: 6px;
      }

      .page-subtitle {
        text-align: center;
        color: #6b7280;
        font-size: 21px;
        margin-bottom: 28px;
      }

      .form-card {
        background: #ffffff;
        border-radius: 14px;
        border: 1px solid #e5e7eb;
        box-shadow: 0 8px 22px rgba(15, 23, 42, 0.08);
        padding: 28px;
      }

      .section-title {
        color: #0b5ed7;
        font-size: 26px;
        font-weight: 700;
        margin-bottom: 18px;
        padding-bottom: 8px;
        border-bottom: 2px solid #0b5ed7;
      }

      .form-label {
        font-weight: 600;
        color: #1f2937;
        margin-bottom: 8px;
      }

      .form-control {
        border-radius: 8px;
        border: 1px solid #cfd8e3;
        min-height: 46px;
      }

      .form-control:focus {
        border-color: #0b5ed7;
        box-shadow: 0 0 0 0.15rem rgba(11, 94, 215, 0.2);
      }

      .helper-text {
        font-size: 13px;
        color: #6b7280;
      }

      .form-actions {
        display: flex;
        justify-content: center;
        gap: 12px;
        margin-top: 26px;
      }

      .btn-save {
        background: linear-gradient(135deg, #0b5ed7, #1f4e79);
        border: none;
        color: #fff;
        padding: 10px 30px;
        border-radius: 8px;
        font-weight: 600;
      }

      .btn-cancel {
        background: #6c757d;
        border: none;
        color: #fff;
        padding: 10px 26px;
        border-radius: 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="page-wrap">
      <div class="page-container">
        <h1 class="page-title">Add Contract Document</h1>
        <p class="page-subtitle">Upload and manage contract documents</p>

        <div class="form-card">
          <h2 class="section-title">Document Details</h2>

          <form id="addContractDocumentForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label for="docName" class="form-label">Document Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="docName"
                  name="doc_name"
                  placeholder="Enter document name"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="docDate" class="form-label">Document Date</label>
                <input
                  type="date"
                  class="form-control"
                  id="docDate"
                  name="doc_date"
                  required
                />
              </div>

              <div class="col-12">
                <label for="docFile" class="form-label">Upload Document</label>
                <div class="helper-text mb-2">
                  Maximum file size allowed: <strong>50 MB</strong>.
                </div>
                <input
                  type="file"
                  class="form-control"
                  id="docFile"
                  name="doc_file"
                  required
                />
              </div>
            </div>

            <input type="hidden" id="deptId" name="dept_id" />
            <input type="hidden" id="statisticId" name="statistic_id" />
            <input type="hidden" id="entityId" name="entity_id" />
            <input
              type="hidden"
              id="docType"
              name="doc_type"
              value="cdoc"
            />

            <div class="form-actions">
              <button type="submit" class="btn-save">Save</button>
              <button type="button" class="btn-cancel" onclick="window.history.back()">Cancel</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script>
      // Extract query parameters
      const urlParams = new URLSearchParams(window.location.search);
      const deptId = urlParams.get("dept_id");
      const statisticId = urlParams.get("statistic_id");
      const entityId = urlParams.get("entity_id");
      const context = urlParams.get("context");

      // Populate hidden fields with URL params or fallback to stored PMC context
      // Populate hidden fields
      document.getElementById("deptId").value = deptId || '';
      document.getElementById("statisticId").value = statisticId || '';
      document.getElementById("entityId").value = entityId || '';
      document.getElementById("docType").value = "cdoc";

      function authFetch(url, options = {}) {
        const token = localStorage.getItem("token");
        const defaultHeaders = {
          Authorization: `Bearer ${token}`,
        };

        return fetch(url, {
          ...options,
          headers: {
            ...defaultHeaders,
            ...(options.headers || {}),
          },
        }).then((res) => {
          if (res.status === 401) {
            alert("Session expired. Redirecting to login...");
            localStorage.clear();
            window.location.href = "/";
            throw new Error("Unauthorized");
          }
          return res;
        });
      }

      // Handle form submission
      document
        .getElementById("addContractDocumentForm")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          // Basic client-side validation for required identifiers
          const bad = (v) => !v || v === "null" || v === "undefined";
          // For PMC context we only require entityId (project identifier)
          if (context === 'pmc') {
            if (bad(entityId)) {
              alert("Missing required project context. Open this page from the project listing.");
              return;
            }
          } else {
            if (bad(deptId) || bad(statisticId) || bad(entityId)) {
              alert("Missing required context (department/statistic). Open this page from the corresponding listing.");
              return;
            }
          }

          const formData = new FormData(this);

          try {
            const context = new URLSearchParams(window.location.search).get("context");
            // Use the general documents endpoint and include entity/context fields; backend can differentiate by parameters
            const endpoint = context === "pmc_ce" ? "/api/data/documents/pmc_ce/document" : "/api/data/documents";

            const response = await authFetch(endpoint, {
              method: "POST",
              body: formData,
            });

            const body = await response.json().catch(() => ({}));

            if (!response.ok) {
              console.error("Upload failed", body);
              alert(body.error || body.message || "Failed to add Contract Document document.");
              return;
            }

            alert("Contract Document document added successfully!");
            // Redirect based on context
            if (context === "pmc_ce") {
              const pmcEntityId = new URLSearchParams(window.location.search).get("pmc_ce_entity_id") || '';
              window.location.href = `/pmc_ce_projects.html?entity_id=${pmcEntityId}&dept_id=${deptId}&statistic_id=${statisticId}&dept_entity_id=${entityId}`;
            } else if (context === 'pmc') {
              // Return to the PMC project page
              const pmcEntityId = new URLSearchParams(window.location.search).get('entity_id') || '';
              window.location.href = `/pmc_projects.html?pmc_entry_id=${encodeURIComponent(pmcEntityId)}`;
            } else {
              window.location.href = `/external.html?dept_id=${deptId}&statistic_id=${statisticId}&entity_id=${entityId}`;
            }
          } catch (err) {
            console.error(err);
            alert("Error adding Contract Document document.");
          }
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
