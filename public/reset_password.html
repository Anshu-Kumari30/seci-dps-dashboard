<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Set New Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet" />
    <style>
      body { font-family: Poppins, sans-serif; background:#f4f6f9; display:flex; height:100vh; align-items:center; justify-content:center; margin:0 }
      .card { background:#fff; padding:28px; border-radius:8px; width:100%; max-width:420px; box-shadow:0 6px 20px rgba(0,0,0,0.08) }
      h2{margin:0 0 12px}
      input{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;margin-bottom:10px}
      button{background:#0d6efd;color:#fff;border:none;padding:10px;border-radius:6px;width:100%}
      .error{color:#b91c1c;min-height:18px}
      .success{color:#15803d;min-height:18px}
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Choose a new password</h2>
      <div id="note" class="helper">Password must be at least 8 characters.</div>
      <div class="error" id="error"></div>
      <div class="success" id="success"></div>
      <input id="new_password" type="password" placeholder="New password" />
      <input id="confirm_password" type="password" placeholder="Confirm password" />
      <button id="submit">Set password</button>
    </div>

    <script>
      function getQueryParam(name) {
        const url = new URL(window.location.href);
        return url.searchParams.get(name);
      }

      const token = getQueryParam('token');
      const email = getQueryParam('email');

      const errorEl = document.getElementById('error');
      const successEl = document.getElementById('success');
      const submit = document.getElementById('submit');

      function setError(msg){ errorEl.textContent = msg || '' }
      function setSuccess(msg){ successEl.textContent = msg || '' }

      submit.addEventListener('click', async ()=>{
        setError(''); setSuccess('');
        const np = document.getElementById('new_password').value;
        const cp = document.getElementById('confirm_password').value;
        if(!np || np.length < 8){ setError('Password should be at least 8 characters'); return }
        if(np !== cp){ setError('Passwords do not match'); return }
        if(!token || !email){ setError('Invalid reset link'); return }

        try{
          const res = await fetch('/api/auth/password/reset',{ method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ email, token, new_password: np }) });
          const json = await res.json();
          if(res.ok){ setSuccess('Password changed — redirecting to login...'); setTimeout(()=>{ window.location.href = '/login.html' }, 1800) }
          else setError(json.error || 'Failed to reset password');
        }catch(e){ setError('Network error'); }
      });
    </script>
  </body>
</html>
