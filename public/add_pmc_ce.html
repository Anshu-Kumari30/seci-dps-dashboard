<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <script src="./js/auth_guard.js"></script>
<title>Edit PMC C&E</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
      .modal-backdrop {
        background-color: rgba(0, 0, 0, 0.5);
      }
      .modal-content {
        border-radius: 8px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
        max-height: 90vh;
        overflow-y: auto;
      }
      .modal-header {
        background: linear-gradient(135deg, #1f4e79, #0b5ed7);
        color: white;
        border: none;
        padding: 20px;
      }
      .modal-title {
        font-size: 18px;
        font-weight: 600;
      }
      .modal-body {
        padding: 20px;
      }
      .form-group label {
        font-weight: 600;
        color: #333;
        font-size: 14px;
        margin-bottom: 8px;
      }
      .form-control {
        padding: 8px 12px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 14px;
      }
      .entity-section {
        background: #f8f9fa;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        padding: 15px;
        margin-bottom: 20px;
      }
      .entity-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 15px;
      }
      .remove-entity-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
      }
      .remove-entity-btn:hover {
        background: #c82333;
      }
      .fields-section {
        background: white;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        padding: 12px;
        margin: 12px 0;
      }
      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr 100px 30px;
        gap: 10px;
        margin-bottom: 10px;
        align-items: flex-end;
      }
      .field-row:last-child {
        margin-bottom: 0;
      }
      .add-field-btn {
        background: #28a745;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        font-size: 12px;
        cursor: pointer;
        margin-top: 10px;
      }
      .add-field-btn:hover {
        background: #218838;
      }
      .remove-field-btn {
        background: #dc3545;
        color: white;
        border: none;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        cursor: pointer;
        width: 100%;
        height: 36px;
      }
      .remove-field-btn:hover {
        background: #c82333;
      }
      .add-entity-section {
        margin-top: 20px;
      }
      .add-entity-btn {
        background: #28a745;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        width: 100%;
      }
      .add-entity-btn:hover {
        background: #218838;
      }
      .modal-footer {
        border-top: 1px solid #dee2e6;
        padding: 15px 20px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .btn-cancel {
        background: #6c757d;
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
      }
      .btn-cancel:hover {
        background: #5c636a;
      }
      .btn-save {
        background: #0d6efd;
        color: white;
        border: none;
        padding: 8px 20px;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn-save:hover {
        background: #0b5ed7;
      }
    </style>
</head>
<body>
    <div class="modal show d-block" style="background-color: rgba(0,0,0,0.5);">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit PMC C&E</h5>
                    <button type="button" class="btn-close btn-close-white" onclick="goBack()"></button>
                </div>

                <div class="modal-body">
                    <!-- Statistic Name -->
                    <div class="form-group mb-3">
                        <label>Statistic Name</label>
                        <input type="text" id="statisticName" class="form-control" readonly />
                    </div>

                    <!-- Entities Container -->
                    <div id="entitiesContainer"></div>

                    <!-- Add Entity Button -->
                    <div class="add-entity-section">
                        <button type="button" class="add-entity-btn" onclick="addNewEntity()">
                            <i class="fas fa-plus"></i> Add Entity
                        </button>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="goBack()">Cancel</button>
                    <button type="button" class="btn-save" onclick="saveEntry()">Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="./js/main.js"></script>
    <script>
        let entities = [];
        let entityCounter = 0;
        let fieldCounter = {};

        function authFetch(url, options = {}) {
            const token = localStorage.getItem("token");
            const defaultHeaders = {
                "Content-Type": "application/json",
                Authorization: `Bearer ${token}`,
            };

            return fetch(url, {
                ...options,
                headers: {
                    ...defaultHeaders,
                    ...(options.headers || {}),
                },
            }).then((res) => {
                if (res.status === 401) {
                    alert("Session expired. Redirecting to login...");
                    localStorage.clear();
                    window.location.href = "/";
                    throw new Error("Unauthorized");
                }
                return res;
            });
        }

        document.addEventListener("DOMContentLoaded", function () {
            document.getElementById('statisticName').value = 'PMC - Consultancy & Engineering Services';
            loadAllEntities();
        });

        function loadAllEntities() {
            authFetch(`/api/data/pmc/ce/entities/all`)
                .then(res => res.ok ? res.json() : Promise.reject('Failed to fetch entities'))
                .then(payload => {
                    const data = Array.isArray(payload.data) ? payload.data : [];
                    entities = data.map((e, idx) => ({
                        id: idx + 1,
                        pmc_ce_entity_id: e.pmc_ce_entity_id,
                        projectName: e.project_name,
                        projectCapacity: e.project_capacity || 0,
                        fields: Array.isArray(e.fields) ? e.fields.map(f => ({
                            name: f.field_name || '',
                            value: f.field_value || '',
                            unit: f.unit || ''
                        })) : []
                    }));
                    entityCounter = entities.length || 0;
                    renderEntities();
                })
                .catch(err => console.error("Error loading entities:", err));
        }

        function renderEntities() {
            const container = document.getElementById('entitiesContainer');
            container.innerHTML = '';

            entities.forEach((entity, index) => {
                const entityDiv = document.createElement('div');
                entityDiv.className = 'entity-section';
                
                let fieldsHTML = '';
                if (entity.fields && entity.fields.length > 0) {
                    entity.fields.forEach((field, fIdx) => {
                        fieldsHTML += `
                            <div class="field-row">
                                <input type="text" class="form-control field-name" value="${field.name || ''}" 
                                    placeholder="Field Name" onchange="updateField(${index}, ${fIdx}, 'name', this.value)" />
                                <input type="text" class="form-control field-value" value="${field.value || ''}" 
                                    placeholder="Value" onchange="updateField(${index}, ${fIdx}, 'value', this.value)" />
                                <input type="text" class="form-control field-unit" value="${field.unit || ''}" 
                                    placeholder="Unit" onchange="updateField(${index}, ${fIdx}, 'unit', this.value)" style="width: 100px;" />
                                <button type="button" class="remove-field-btn" onclick="removeField(${index}, ${fIdx})">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        `;
                    });
                }

                entityDiv.innerHTML = `
                    <div class="entity-header">
                        <strong>Project Name</strong>
                        <button type="button" class="remove-entity-btn" onclick="removeEntity(${index})">
                            <i class="fas fa-trash"></i> Remove Entity
                        </button>
                    </div>
                    <div class="form-group mb-3">
                        <input type="text" class="form-control entity-name" value="${entity.projectName}" 
                            onchange="updateEntity(${index}, 'projectName', this.value)" 
                            placeholder="Enter project name" />
                    </div>

                    <div class="form-group mb-3">
                        <label>Project Capacity</label>
                        <input type="text" class="form-control entity-value" value="${entity.projectCapacity}" 
                            onchange="updateEntity(${index}, 'projectCapacity', this.value)" 
                            placeholder="Enter capacity" />
                    </div>

                    <div class="fields-section">
                        <strong style="display: block; margin-bottom: 10px;">Fields</strong>
                        ${fieldsHTML}
                        <button type="button" class="add-field-btn" onclick="addNewField(${index})">
                            <i class="fas fa-plus"></i> Add Field
                        </button>
                    </div>
                `;
                
                container.appendChild(entityDiv);
            });
        }

        function addNewEntity() {
            entityCounter++;
            entities.push({
                id: entityCounter,
                pmc_ce_entity_id: '',
                projectName: '',
                projectCapacity: 0,
                fields: []
            });
            fieldCounter[entityCounter] = 0;
            renderEntities();
        }

        function removeEntity(index) {
            if (confirm('Are you sure you want to remove this entity?')) {
                entities.splice(index, 1);
                renderEntities();
            }
        }

        function addNewField(entityIndex) {
            if (!entities[entityIndex].fields) {
                entities[entityIndex].fields = [];
            }
            entities[entityIndex].fields.push({
                name: '',
                value: '',
                unit: ''
            });
            renderEntities();
        }

        function removeField(entityIndex, fieldIndex) {
            if (entities[entityIndex].fields) {
                entities[entityIndex].fields.splice(fieldIndex, 1);
                renderEntities();
            }
        }

        function updateEntity(index, field, value) {
            if (entities[index]) {
                entities[index][field] = value;
            }
        }

        function updateField(entityIndex, fieldIndex, fieldName, value) {
            if (entities[entityIndex] && entities[entityIndex].fields && entities[entityIndex].fields[fieldIndex]) {
                entities[entityIndex].fields[fieldIndex][fieldName] = value;
            }
        }

        function saveEntry() {
            if (entities.length === 0) {
                alert('Please add at least one entity');
                return;
            }

            // Validate all entities have names
            const allValid = entities.every(e => e.projectName.trim());
            if (!allValid) {
                alert('Please fill in all project names');
                return;
            }

            // Prepare payload for PMC C&E API
            const payload = {
                entities: entities.map(entity => ({
                    projectName: entity.projectName,
                    projectCapacity: entity.projectCapacity,
                    fields: (entity.fields || []).filter(f => f.name || f.value)
                }))
            };

            authFetch('/api/data/pmc/ce/entities/save', {
                method: 'POST',
                body: JSON.stringify(payload)
            })
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(data => {
                            const errorMsg = data?.message || `HTTP ${res.status}`;
                            throw new Error(errorMsg);
                        }).catch(() => {
                            throw new Error(`HTTP ${res.status}: Failed to save C&E entities. Check server logs.`);
                        });
                    }
                    return res.json();
                })
                .then(() => {
                    alert('C&E entities saved successfully!');
                    // Redirect to home so PMC charts refresh from the server
                    window.location.href = '/home.html?t=' + Date.now();
                })
                .catch(err => {
                    console.error(err);
                    alert('Error saving C&E entities: ' + err.message);
                });
        }

        function goBack() {
            window.history.back();
        }
    </script>
</body>
</html>
