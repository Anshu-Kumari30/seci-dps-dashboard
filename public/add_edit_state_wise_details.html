<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Add / Edit State Wise Details</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    
    <script src="./js/auth_guard.js"></script>
<style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #f4f6f9 0%, #e8ecf1 100%);
            padding: 20px;
            min-height: 100vh;
            color: #333;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #0b5ed7;
            font-weight: 700;
            font-size: 28px;
        }

        .form-container {
            max-width: 900px;
            margin: auto;
            background: #ffffff;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px 30px;
        }

        .form-section {
            grid-column: span 2;
            margin-top: 10px;
            padding-bottom: 8px;
            border-bottom: 2px solid #0b5ed7;
            color: #0b5ed7;
            font-weight: 600;
            font-size: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .required::after {
            content: " *";
            color: #dc3545;
        }

        input {
            padding: 12px;
            font-size: 15px;
            border: 1px solid #cfd4da;
            border-radius: 6px;
        }

        .full-width {
            grid-column: span 2;
        }

        .existing-file {
            margin-top: 8px;
            font-size: 14px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
            grid-column: span 2;
        }

        button {
            padding: 12px 32px;
            font-size: 15px;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            min-width: 140px;
        }

        .btn-submit {
            background: #0b5ed7;
            color: #fff;
        }

        .btn-cancel {
            background: #6c757d;
            color: #fff;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 12px;
            border-radius: 5px;
        }

        select {
            padding: 12px;
            font-size: 15px;
            border: 1px solid #cfd4da;
            border-radius: 6px;
            background: #fff;
        }

        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
            }

            .form-section,
            .full-width,
            .btn-group {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <h1 id="pageTitle">Add State Wise Details</h1>

    <div class="form-container">

        <form id="stateForm">

            <div class="form-section">State Information</div>

            <div class="form-group">
                <label class="required">Discom Name</label>
                <input type="text" name="discom_name" required />
            </div>

            <div class="form-group">
                <label class="required">State</label>
                <select name="state" id="stateSelect" required>
                    <option value="">-- Select State --</option>
                </select>
            </div>


            <div class="form-group">
                <label class="required">PSA Signed (MW)</label>
                <input type="number" step="0.01" name="psa_signed_mw" required />
            </div>

            <div class="form-group">
                <label class="required">Commissioned (MW)</label>
                <input type="number" step="0.01" name="commissioned_mw" required />
            </div>

            <div class="form-section">Documents</div>

            <div class="form-group full-width">
                <label class="required">Regulations / Policy</label>
                <input type="file" name="regulations" id="regulationsInput" />
                <div id="existingRegulation" class="existing-file"></div>
            </div>

            <div class="form-group full-width">
                <label>Report (Optional)</label>
                <input type="file" name="report" id="reportInput" />
                <div id="existingReport" class="existing-file"></div>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-submit">Save</button>
                <a href="/energy_management.html" class="btn-cancel">Cancel</a>
            </div>

        </form>

    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");
        const project = params.get("project");
        const tab = params.get("tab") || "swd";

        function buildEnergyManagementBackUrl() {
            const q = new URLSearchParams();
            if (project) q.set("project", project);
            if (tab) q.set("tab", tab);
            return "/energy_management.html" + (q.toString() ? `?${q.toString()}` : "");
        }

        // preserve cancel link to include project filter when present
        const cancelLink = document.querySelector('.btn-cancel');
        if (cancelLink) cancelLink.href = buildEnergyManagementBackUrl();

        const form = document.getElementById("stateForm");
        const title = document.getElementById("pageTitle");
        const existingReg = document.getElementById("existingRegulation");
        const existingRep = document.getElementById("existingReport");
        const regulationsInput = document.getElementById("regulationsInput");
        const stateSelect = document.getElementById("stateSelect");

        // ================= STATES LIST =================
        const states = [
            "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar",
            "Chhattisgarh", "Goa", "Gujarat", "Haryana",
            "Himachal Pradesh", "Jharkhand", "Karnataka", "Kerala",
            "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya",
            "Mizoram", "Nagaland", "Odisha", "Punjab",
            "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana",
            "Tripura", "Uttar Pradesh", "Uttarakhand", "West Bengal",
            "Andaman and Nicobar Islands", "Chandigarh",
            "Dadra and Nagar Haveli and Daman and Diu",
            "Delhi", "Jammu and Kashmir", "Ladakh",
            "Lakshadweep", "Puducherry"
        ];

        // Populate dropdown
        states.forEach(state => {
            const option = document.createElement("option");
            option.value = state;
            option.textContent = state;
            stateSelect.appendChild(option);
        });

        // ================= EDIT MODE =================
        if (id) {
            title.innerText = "Edit State Wise Details";

            // Regulations file not required while editing
            regulationsInput.removeAttribute("required");

            authFetch(`/api/data/state-wise-details/${id}`)
                .then(res => res.json())
                .then(data => {

                    form.discom_name.value = data.discom_name;
                    form.psa_signed_mw.value = data.psa_signed_mw;
                    form.commissioned_mw.value = data.commissioned_mw;

                    // Correct way to set dropdown value
                    stateSelect.value = data.state;

                    if (data.regulations_policy_path) {
                        existingReg.innerHTML =
                            `Existing: <a href="/${data.regulations_policy_path}" target="_blank">View</a>`;
                    }

                    if (data.report_path) {
                        existingRep.innerHTML =
                            `Existing: <a href="/${data.report_path}" target="_blank">View</a>`;
                    }
                });
        } else {
            // Regulations file required while adding
            regulationsInput.setAttribute("required", true);
        }

        // ================= FORM SUBMIT =================
        form.addEventListener("submit", function (e) {
            e.preventDefault();

            if (!project) {
                alert("Please open this form from a project in Energy Management.");
                return;
            }

            const psa = parseFloat(form.psa_signed_mw.value);
            const commissioned = parseFloat(form.commissioned_mw.value);

            // Frontend Validation
            // if (commissioned > psa) {
            //     alert("Commissioned MW cannot be greater than PSA Signed MW.");
            //     return;
            // }

            const formData = new FormData(form);
            formData.set("project_name", project);

            let url = "/api/data/state-wise-details";
            let method = "POST";

            if (id) {
                url = `/api/data/state-wise-details/${id}`;
                method = "PUT";
            }

            fetch(url, {
                method,
                headers: {
                    Authorization: `Bearer ${localStorage.getItem("token")}`
                },
                body: formData
            })
                .then(async (res) => {
                    const data = await res.json().catch(() => ({}));
                    if (!res.ok) {
                        throw new Error(data.error || data.message || "Failed to save state wise details");
                    }
                    return data;
                })
                .then(() => {
                    alert(id ? "Updated successfully" : "Added successfully");
                    window.location.href = buildEnergyManagementBackUrl();
                })
                .catch(err => {
                    console.error(err);
                    alert(err.message || "Something went wrong.");
                });
        });

        function authFetch(url) {
            return fetch(url, {
                headers: {
                    Authorization: `Bearer ${localStorage.getItem("token")}`
                }
            });
        }
    </script>


</body>

</html>
